server {
    listen 80;
    server_name scanner.aksenovaks.online;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name scanner.aksenovaks.online;

    ssl_certificate /etc/letsencrypt/live/scanner.aksenovaks.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanner.aksenovaks.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 302 /scanner;
    }

    location /scanner {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /scanner/api/ {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

server {
    listen 8081;
    server_name _;

    location = / {
        return 302 /scanner;
    }

    location /scanner {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
